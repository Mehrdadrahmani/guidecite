<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="785" viewBox="0 0 1400 785" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B8794"/></marker></defs>
<rect width="1400" height="785" fill="#FFFFFF"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#1F2933">GuideCite pipeline<tspan dx="14" font-weight="400" fill="#52606D">—</tspan><tspan dx="10" font-weight="400" fill="#52606D">answers from clinical guidelines, with citations</tspan></text>
<rect x="20" y="70" width="1360" height="190" rx="14" fill="#F4F7FF" stroke="#D5DEF7" stroke-width="1.2"/>
<text x="40" y="96" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#3B5BDB">1 · OFFLINE INDEXING</text>
<rect x="45" y="112" width="220" height="124" rx="10" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.6"/>
<text x="155.0" y="162.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Guideline corpus</text>
<text x="155.0" y="179.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">epfl-llm/guidelines</text>
<text x="155.0" y="196.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">WHO · CDC · NICE</text>
<rect x="305" y="112" width="220" height="124" rx="10" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.6"/>
<text x="415.0" y="162.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Sample &amp; clean</text>
<text x="415.0" y="179.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">300 docs (100 per source)</text>
<text x="415.0" y="196.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">normalise text, infer titles</text>
<rect x="565" y="112" width="230" height="124" rx="10" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.6"/>
<text x="680.0" y="153.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Structure-aware chunking</text>
<text x="680.0" y="170.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">heading-aware, ~450 tokens</text>
<text x="680.0" y="187.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">64-token overlap</text>
<text x="680.0" y="204.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3B5BDB">8,634 chunks</text>
<rect x="840" y="108" width="260" height="62" rx="10" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.6"/>
<text x="970.0" y="135.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Dense index</text>
<text x="970.0" y="152.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">bge-base-en-v1.5 → Qdrant</text>
<rect x="840" y="180" width="260" height="62" rx="10" fill="#FFFFFF" stroke="#3B5BDB" stroke-width="1.6"/>
<text x="970.0" y="207.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Sparse index</text>
<text x="970.0" y="224.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">BM25 Okapi</text>
<line x1="265" y1="174" x2="303" y2="174" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="525" y1="174" x2="563" y2="174" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="795" y1="160" x2="838" y2="139" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="795" y1="188" x2="838" y2="211" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1140" y="150" font-size="12.5" fill="#52606D"><tspan x="1140" dy="0">Reproducible from scratch:</tspan><tspan x="1140" dy="20" font-family="Menlo, Consolas, monospace" fill="#3B5BDB">make data</tspan><tspan x="1140" dy="20" font-family="Menlo, Consolas, monospace" fill="#3B5BDB">make index</tspan></text>
<rect x="20" y="300" width="1360" height="245" rx="14" fill="#F1FAF6" stroke="#CBE9DB" stroke-width="1.2"/>
<text x="40" y="326" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#0B7A55">2 · ONLINE QUERY  (FastAPI  POST /ask)</text>
<rect x="40" y="345" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#0B7A55" stroke-width="1.6"/>
<text x="110.0" y="418.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Question</text>
<text x="110.0" y="435.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">free-text</text>
<text x="110.0" y="452.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">clinical query</text>
<rect x="208" y="345" width="140" height="78" rx="10" fill="#FFFFFF" stroke="#0B7A55" stroke-width="1.6"/>
<text x="278.0" y="380.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Dense search</text>
<text x="278.0" y="397.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">top-30</text>
<rect x="208" y="437" width="140" height="78" rx="10" fill="#FFFFFF" stroke="#0B7A55" stroke-width="1.6"/>
<text x="278.0" y="472.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">BM25 search</text>
<text x="278.0" y="489.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">top-30</text>
<rect x="376" y="345" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#0B7A55" stroke-width="1.6"/>
<text x="446.0" y="418.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">RRF fusion</text>
<text x="446.0" y="435.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">reciprocal rank</text>
<text x="446.0" y="452.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">fusion, k = 60</text>
<rect x="544" y="345" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#0B7A55" stroke-width="1.6"/>
<text x="614.0" y="409.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Rerank</text>
<text x="614.0" y="426.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">cross-encoder</text>
<text x="614.0" y="443.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">bge-reranker-base</text>
<text x="614.0" y="460.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0B7A55">25 → top 5</text>
<rect x="712" y="345" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#0B7A55" stroke-width="1.6"/>
<text x="782.0" y="418.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Grounded prompt</text>
<text x="782.0" y="435.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">numbered passages</text>
<text x="782.0" y="452.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">cite [n] or abstain</text>
<rect x="880" y="345" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#0B7A55" stroke-width="1.6"/>
<text x="950.0" y="409.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">LLM</text>
<text x="950.0" y="426.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">Qwen3-8B (local)</text>
<text x="950.0" y="443.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">via Ollama; any</text>
<text x="950.0" y="460.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">LangChain provider</text>
<rect x="1048" y="345" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#0B7A55" stroke-width="1.6"/>
<text x="1118.0" y="409.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Citation check</text>
<text x="1118.0" y="426.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">every [n] must</text>
<text x="1118.0" y="443.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">resolve to a</text>
<text x="1118.0" y="460.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">passage</text>
<rect x="1216" y="345" width="140" height="170" rx="10" fill="#FFFFFF" stroke="#0B7A55" stroke-width="1.6"/>
<text x="1286.0" y="409.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Response</text>
<text x="1286.0" y="426.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">answer + sources</text>
<text x="1286.0" y="443.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">+ disclaimer</text>
<text x="1286.0" y="460.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">+ timings</text>
<path d="M970,242 L970,280 L334,280 L334,341" fill="none" stroke="#7B8794" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="652" y="274" text-anchor="middle" font-size="12" font-style="italic" fill="#52606D">indexes queried at runtime</text>
<line x1="180" y1="418.0" x2="206" y2="384" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="180" y1="442.0" x2="206" y2="476" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="348" y1="384" x2="374" y2="418.0" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="348" y1="476" x2="374" y2="442.0" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="516" y1="430.0" x2="542" y2="430.0" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="684" y1="430.0" x2="710" y2="430.0" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="852" y1="430.0" x2="878" y2="430.0" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1020" y1="430.0" x2="1046" y2="430.0" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1188" y1="430.0" x2="1214" y2="430.0" stroke="#7B8794" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="535" text-anchor="middle" font-size="12" fill="#52606D">Retrieval mode is one config switch: <tspan font-family="Menlo, Consolas, monospace" fill="#0B7A55">dense | bm25 | hybrid | hybrid_rerank</tspan></text>
<rect x="20" y="570" width="1360" height="195" rx="14" fill="#FFF8EC" stroke="#F2DDB4" stroke-width="1.2"/>
<text x="40" y="596" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#B26A00">3 · EVALUATION  (outputs committed to results/)</text>
<rect x="35" y="610" width="310" height="135" rx="10" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.6"/>
<text x="190.0" y="657.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Retrieval ablation</text>
<text x="190.0" y="674.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">201 synthetic questions</text>
<text x="190.0" y="691.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">4 retrieval modes</text>
<text x="190.0" y="708.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">Recall@k · MRR@10 · latency</text>
<rect x="375" y="610" width="310" height="135" rx="10" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.6"/>
<text x="530.0" y="648.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Answer quality</text>
<text x="530.0" y="665.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">50 questions, hybrid + rerank</text>
<text x="530.0" y="682.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">RAGAS: faithfulness, relevancy,</text>
<text x="530.0" y="699.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">context precision / recall</text>
<text x="530.0" y="716.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">citation validity</text>
<rect x="715" y="610" width="310" height="135" rx="10" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.6"/>
<text x="870.0" y="657.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">Abstention</text>
<text x="870.0" y="674.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">20 out-of-scope questions</text>
<text x="870.0" y="691.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">medical-not-in-corpus,</text>
<text x="870.0" y="708.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">non-medical, prompt injection</text>
<rect x="1055" y="610" width="310" height="135" rx="10" fill="#FFFFFF" stroke="#B26A00" stroke-width="1.6"/>
<text x="1210.0" y="657.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2933">MedQA (USMLE)</text>
<text x="1210.0" y="674.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">300 questions</text>
<text x="1210.0" y="691.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">with vs without retrieval</text>
<text x="1210.0" y="708.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#52606D">Wilson 95% CI · McNemar test</text>
</svg>