[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medguide"
version = "0.1.0"
description = "GuideCite: answers from clinical guidelines, with citations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # data
    "datasets>=3.0",
    "pandas>=2.2",
    "pyarrow>=16",
    # retrieval / embeddings
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    # langchain
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.2",
    "langchain-qdrant>=0.2",
    "langchain-huggingface>=0.1",
    # eval
    "ragas>=0.4,<0.5",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2
    "langchain-community>=0.4,<0.4.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    # api / config
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
